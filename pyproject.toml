[project]
name = "octo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiolimiter>=1.3.0",
    "alembic>=1.19.1",
    "asyncpg>=0.30.0",
    "av>=18.0.0",
    "cairosvg>=2.9.0",
    "chromadb>=1.5.9",
    "einops>=0.8.0",
    "fastapi>=0.139.0",
    "gallery-dl>=1.32.11",
    "grpcio>=1.82.1",
    "gunicorn>=26.0.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "instaloader>=4.15.3",
    "lancedb>=0.34.0",
    "librosa>=0.11.0",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.9.0",
    "pyjwt>=2.13.0",
    "pypdfium2>=5.11.0",
    "python-multipart>=0.0.32",
    "qdrant-client[fastembed]>=1.13.0",
    "sentence-transformers>=5.6.0",
    "soundfile>=0.14.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "structlog>=26.1.0",
    "torchvision>=0.28.0",
    # Cosmos-Embed1's trust_remote_code implementation does not load on transformers 5.
    "transformers>=4.51,<5",
    "uvloop>=0.22.1",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "yapf>=0.43.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Apply excludes even to explicitly passed files (IDE, pre-commit).
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "FBT", "SIM"]
# Layout belongs to yapf; ruff only reports logic issues.
ignore = ["E501"]
# `ruff check --fix` only sorts imports and drops unused ones.
fixable = ["I", "F401"]

[tool.ruff.format]
# Formatting belongs to yapf; make `ruff format` a no-op.
exclude = ["*"]

[tool.yapf]
based_on_style = "pep8"
column_limit = 100
indent_width = 4
continuation_indent_width = 8
dedent_closing_brackets = true
split_before_first_argument = true

[project]
name = "octo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiolimiter>=1.3.0",
    "alembic>=1.19.1",
    "asyncpg>=0.30.0",
    "av>=18.0.0",
    "cairosvg>=2.9.0",
    "chromadb>=1.5.9",
    "einops>=0.8.0",
    "fastapi>=0.139.0",
    "fastapi-filter>=3.0.0",
    "fastapi-pagination>=0.15.16",
    "gallery-dl>=1.32.11",
    "grpcio>=1.82.1",
    "gunicorn>=26.0.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "instaloader>=4.15.3",
    "lancedb>=0.34.0",
    "librosa>=0.11.0",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.9.0",
    "pyjwt>=2.13.0",
    "pypdfium2>=5.11.0",
    "python-multipart>=0.0.32",
    "qdrant-client[fastembed]>=1.13.0",
    # EmbeddingGemma 2 multimodal dict inputs need sentence-transformers 6.1.
    "sentence-transformers>=6.1.0",
    "soundfile>=0.14.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "structlog>=26.1.0",
    "torchvision>=0.28.0",
    # EmbeddingGemma 2 (Gemma 4 based) needs transformers 5.18. Cosmos-Embed1 does not load on
    # transformers 5, so it runs only from the separate `.venv-cosmos` (see AGENTS.md).
    "transformers>=5.18",
    "uvloop>=0.22.1",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Apply excludes even to explicitly passed files (IDE, pre-commit).
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "FBT", "SIM"]
# Layout belongs to the formatter (pyfmt); lines it cannot split are not lint errors.
ignore = ["E501"]
# `ruff check --fix` only sorts imports and drops unused ones.
fixable = ["I", "F401"]

[tool.ruff.format]
quote-style = "double"
# A trailing comma keeps arguments one per line; ~/.local/bin/pyfmt adds it
# wherever a declaration or call has more than two parameters.
skip-magic-trailing-comma = false
